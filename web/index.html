<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>תורנצ׳יק</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1466" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="תורנצ׳יק" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <!-- If the app cannot start (old browser, failed script load, crash), show why instead of a blank page. -->
    <div id="boot-error" style="display:none;font-family:Arial,sans-serif;padding:24px;max-width:640px;margin:40px auto;border:1px solid #d33;border-radius:10px;background:#fff5f5;color:#611">
      <b>האפליקציה לא הצליחה לעלות.</b>
      <pre id="boot-error-text" style="white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;margin-top:12px"></pre>
    </div>
    <!-- A new version was deployed while this tab ran an older one: its pages are gone from the server.
         The owl says so and the page reloads itself into the new version. -->
    <div id="app-update" style="display:none;position:fixed;inset:0;z-index:9999;background:#fbf6ec;font-family:Assistant,Arial,sans-serif;color:#1a1466;text-align:center;padding:24px">
      <div style="max-width:360px;margin:12vh auto 0">
        <img src="/brand/owl/clipboard.webp" alt="" width="180" height="180" style="width:180px;height:180px;object-fit:contain" />
        <h1 style="font-size:24px;margin:16px 0 8px">תורנצ׳יק מתעדכן</h1>
        <p id="app-update-text" style="font-size:17px;margin:0;color:#3d3a5c">יצאה גרסה חדשה. אני טוען אותה בשבילך, זה ייקח רגע…</p>
        <button id="app-update-btn" type="button" onclick="location.reload()" style="display:none;margin-top:20px;font:inherit;font-weight:700;font-size:17px;padding:10px 24px;border:0;border-radius:10px;background:#1a1466;color:#fff;cursor:pointer">טעינה מחדש</button>
      </div>
    </div>
    <script>
      (function () {
        var STALE = /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|Unable to preload CSS|ChunkLoadError|failed to load \S*\/assets\//i;
        function update() {
          if (window.__updating) return;
          window.__updating = true;
          document.getElementById("boot-error").style.display = "none";
          document.getElementById("app-update").style.display = "block";
          var last = 0;
          try { last = +sessionStorage.getItem("mahan.updateReload") || 0; } catch (e) {}
          if (Date.now() - last < 30000) {
            // reloaded a moment ago and still failing: let the user try again rather than loop
            document.getElementById("app-update-text").textContent = "העדכון לוקח קצת יותר זמן מהרגיל. נסה לטעון שוב בעוד רגע.";
            document.getElementById("app-update-btn").style.display = "inline-block";
            return;
          }
          try { sessionStorage.setItem("mahan.updateReload", String(Date.now())); } catch (e) {}
          setTimeout(function () { location.reload(); }, 1500);
        }
        window.__appUpdate = update;
        // the back button can restore this page from the browser's memory, after a deploy:
        // check that its files are still there, and update if not
        window.addEventListener("pageshow", function (e) {
          if (!e.persisted) return;
          var s = document.querySelector('script[type="module"][src*="/assets/"]');
          if (!s) return;
          fetch(s.src, { method: "HEAD", cache: "no-store" }).then(function (r) { if (!r.ok) update(); }).catch(function () {});
        });
        function show(msg) {
          if (STALE.test(msg)) return update();
          if (window.__updating) return;
          var box = document.getElementById("boot-error");
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0 && !window.__bootFailed) return;
          window.__bootFailed = true;
          box.style.display = "block";
          document.getElementById("boot-error-text").textContent += msg + "\n";
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) {
            // a missing font or stylesheet is cosmetic; only a script that failed to load stops the app
            if (t.tagName === "SCRIPT") show("failed to load " + t.src);
            return;
          }
          else show((e.message || "error") + (e.filename ? " @ " + e.filename + ":" + e.lineno : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show("unhandled: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) show("the app did not render within 8 seconds (" + navigator.userAgent + ")");
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
