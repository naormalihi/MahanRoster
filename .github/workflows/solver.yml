name: solver

on:
  push:
    paths: ["solver/**", ".github/workflows/solver.yml"]
  pull_request:
    paths: ["solver/**", ".github/workflows/solver.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Benchmark – fictitious month
        run: |
          python -m toranut_solver generate --months 1 -o problem.json
          python -m toranut_solver solve problem.json -o solution.json --time-limit 120 --workers 2
          python -m toranut_solver verify problem.json solution.json
          python -m toranut_solver report problem.json solution.json -o report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: solver-report
          path: |
            solver/report.md
            solver/solution.json
