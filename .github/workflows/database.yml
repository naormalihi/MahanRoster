name: database

# Runs once per pull request (and again on each new push to it), not on every push to a branch:
# a push and its pull request used to run the same checks twice. Free private repos get
# 2,000 Actions minutes a month. A newer push to the same pull request cancels the older run.
on:
  pull_request:
    paths: ["supabase/**", "solver/**", ".github/workflows/database.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "solver[dev,worker]"
      - run: pytest -q supabase/tests
