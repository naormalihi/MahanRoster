name: db-migrate

# Applies new SQL migrations to the Supabase project.
# Needs the repository secret SUPABASE_DB_URL: the "Session pooler" connection
# string from Supabase › Connect (the direct db.<ref> host is IPv6-only).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency: db-migrate

jobs:
  # an encrypted copy of the database before anything changes it (see backup.yml)
  backup:
    uses: ./.github/workflows/backup.yml
    with:
      reason: before migration
    secrets: inherit

  migrate:
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::SUPABASE_DB_URL secret is not set"; exit 1; fi
      - name: Describe connection string (no secrets printed)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ["DATABASE_URL"].strip())
          pw = unquote(u.password or "")
          print("scheme:", u.scheme)
          print("user:", u.username)
          print("host:", u.hostname, "port:", u.port, "db:", u.path)
          print("password length:", len(pw), "| only letters/digits:", pw.isalnum(),
                "| has brackets:", any(c in pw for c in "[]"), "| has spaces:", pw != pw.strip() or " " in pw)
          if not (u.username or "").startswith("postgres."):
              print("::warning::user should be postgres.<project-ref> for the Session pooler")
          if raw := re.search(r":([^:@/]*)@", os.environ["DATABASE_URL"]):
              if any(c in raw.group(1) for c in "#/?"):
                  print("::warning::password contains # / or ? – must be percent-encoded")
          PY
      # the runner image already has psql; install only when missing (with a fresh index)
      - run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase/apply_migrations.sh
      # the audit log was cut down (migration 080); give the freed space back once it is large
      - name: Compact the audit log when bloated
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sleep 5  # let the statistics catch up with the delete
          big=$(psql "$DATABASE_URL" -At -X -c "select n_dead_tup > n_live_tup and pg_total_relation_size(relid) > 50 * 1024 * 1024 from pg_stat_user_tables where schemaname = 'public' and relname = 'audit_log'")
          if [ "$big" = "t" ]; then echo "compacting audit_log"; psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "vacuum full analyze public.audit_log"; else echo "audit_log is compact"; fi
