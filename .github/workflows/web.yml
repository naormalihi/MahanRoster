name: web

# Runs once per pull request (and again on each new push to it), not on every push to a branch:
# a push and its pull request used to run the same checks twice. Free private repos get
# 2,000 Actions minutes a month. A newer push to the same pull request cancels the older run.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest run
      - run: npx vite build
